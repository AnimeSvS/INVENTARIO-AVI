<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVICRUZ SAC - Login Seguro</title>

    <!-- Seguridad: Prevenir ataques comunes -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="referrer" content="strict-origin">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 
        https://www.gstatic.com 
        https://cdn.jsdelivr.net 
        'sha256-F37YmOg22CvQvrbXKwK0jLlv/7jlv3hYVbhWNORbaxM=' 
        'sha256-vvt4KWwuNr51XfE5m+hzeNEGhiOfZzG97ccfqGsPwvE=';
    style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
    img-src 'self' data: https://www.google.com;
    connect-src 'self' 
        https://*.firebaseio.com 
        https://*.firebaseapp.com 
        https://firestore.googleapis.com;
    frame-src 'self' https://*.firebaseapp.com;
">

    <!-- CSS mínimo para login (no cargar todo) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/login-styles.css">

    <!-- Prevenir caching de login -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>

<body>
    <!-- Contenedor de login seguro -->
    <div id="loginContainer" class="login-container">
        <div class="login-wrapper">
            <div class="login-card">
                <!-- Header con logo -->
                <div class="login-header">
                    <div class="logo-container">
                        <div class="logo-icon">🐔</div>
                        <h1 class="logo-text">AVICRUZ SAC</h1>
                        <p class="logo-subtitle">Sistema de Gestión Avícola</p>
                    </div>
                </div>

                <!-- Formulario de login seguro -->
                <div class="login-body">
                    <form id="loginForm" novalidate>

                        <!-- Email / Usuario -->
                        <input type="text" id="loginUser" class="form-control mb-2"
                            placeholder="Correo o usuario admin">

                        <!-- Password -->
                        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña">

                        <button type="submit" class="btn btn-login w-100">
                            Iniciar Sesión
                        </button>

                        <small class="text-muted d-block mt-3 text-center">
                            Tip: el administrador usa su usuario secreto
                        </small>

                    </form>

                </div>

                <!-- Footer con información -->
                <footer style="text-align: center; padding: 15px; font-size: 14px; color: #666;">
                    © <span id="añoActual"></span> <strong>SedyGames</strong>. Todos los derechos reservados.
                    · <a href="terminos.html">Términos de Uso</a>
                </footer>

            </div>
        </div>
    </div>

    <!-- 1. Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="assets/firebase-config.js"></script>
<script src="js/offline-auth.js"></script>
<script src="js/admin-secret.js"></script> <!-- 🔐 ESTE -->
<script src="js/login-inline.js"></script>


</body>

</html>
